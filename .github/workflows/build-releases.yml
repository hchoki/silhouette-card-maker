name: Build Releases

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Windows executable
        run: |
          cd build_tools && python -m PyInstaller --clean --distpath .. --workpath build SilhouetteCardMaker.spec
      
      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          fi
      
      - name: Package Windows release
        shell: bash
        run: |
          mkdir -p release
          cp SilhouetteCardMaker.exe release/
          # Copy all source files
          cp -r assets calibration cutting_templates plugins game examples gui test release/
          cp *.py *.md *.txt release/ 2>/dev/null || true
          # Remove build artifacts and unnecessary folders
          rm -rf release/__pycache__ release/data release/.git release/.github release/build_tools
          find release -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilhouetteCardMaker-Windows
          path: release/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build macOS app
        run: |
          cd build_tools && python -m PyInstaller --clean --distpath .. --workpath build SilhouetteCardMaker.spec
      
      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          fi
      
      - name: Package macOS release
        run: |
          mkdir -p release
          cp -r SilhouetteCardMaker.app release/
          # Copy all source files
          cp -r assets calibration cutting_templates plugins game examples gui test release/
          cp *.py *.md *.txt release/ 2>/dev/null || true
          # Remove build artifacts and unnecessary folders
          rm -rf release/__pycache__ release/data release/.git release/.github release/build_tools
          find release -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilhouetteCardMaker-macOS
          path: release/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Linux executable
        run: |
          cd build_tools && python -m PyInstaller --clean --distpath .. --workpath build SilhouetteCardMaker.spec
      
      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          fi
      
      - name: Download and setup appimagetool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # Extract appimagetool since FUSE is not available in GitHub Actions
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root appimagetool-squashfs
      
      - name: Create AppImage
        run: |
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy executable
          cp SilhouetteCardMaker AppDir/usr/bin/
          
          # Copy desktop file
          cp build_tools/SilhouetteCardMaker.desktop AppDir/usr/share/applications/
          cp build_tools/SilhouetteCardMaker.desktop AppDir/
          
          # Create AppRun script
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          cd "${HERE}/usr/bin"
          exec "${HERE}/usr/bin/SilhouetteCardMaker" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Build AppImage using extracted appimagetool with --no-appstream to skip icon validation
          ARCH=x86_64 ./appimagetool-squashfs/AppRun --no-appstream AppDir SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-x86_64.AppImage
      
      - name: Package Linux release
        run: |
          mkdir -p release
          cp SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-x86_64.AppImage release/
          # Copy all source files
          cp -r assets calibration cutting_templates plugins game examples gui test release/
          cp *.py *.md *.txt release/ 2>/dev/null || true
          # Remove build artifacts and unnecessary folders
          rm -rf release/__pycache__ release/data release/.git release/.github release/build_tools
          find release -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilhouetteCardMaker-Linux
          path: release/

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create release packages
        run: |
          cd SilhouetteCardMaker-Windows
          zip -r ../SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-Windows.zip *
          cd ..
          
          cd SilhouetteCardMaker-macOS
          zip -r ../SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-macOS.zip *
          cd ..
          
          cd SilhouetteCardMaker-Linux
          tar -czf ../SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-Linux.tar.gz *
          cd ..
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-Windows.zip
            SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-macOS.zip
            SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-Linux.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
