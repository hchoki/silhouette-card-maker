name: Build Releases

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Windows executable
        run: |
          cd build_tools && python -m PyInstaller --clean --distpath .. --workpath build SilhouetteCardMaker.spec
      
      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          fi
      
      - name: Package Windows release
        shell: bash
        run: |
          mkdir -p release
          cp SilhouetteCardMaker.exe release/
          cp -r assets calibration cutting_templates plugins game examples release/
          cp README.md LICENSE.md requirements.txt release/
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilhouetteCardMaker-Windows
          path: release/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build macOS app
        run: |
          cd build_tools && python -m PyInstaller --clean --distpath .. --workpath build SilhouetteCardMaker.spec
      
      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          fi
      
      - name: Package macOS release
        run: |
          mkdir -p release
          cp -r SilhouetteCardMaker.app release/
          cp -r assets calibration cutting_templates plugins game examples release/
          cp README.md LICENSE.md requirements.txt release/
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilhouetteCardMaker-macOS
          path: release/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Linux executable
        run: |
          cd build_tools && python -m PyInstaller --clean --distpath .. --workpath build SilhouetteCardMaker.spec
      
      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          fi
      
      - name: Package Linux release
        run: |
          mkdir -p release
          cp SilhouetteCardMaker release/
          cp -r assets calibration cutting_templates plugins game examples release/
          cp README.md LICENSE.md requirements.txt release/
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilhouetteCardMaker-Linux
          path: release/

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create release packages
        run: |
          cd SilhouetteCardMaker-Windows
          zip -r ../SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-Windows.zip *
          cd ..
          
          cd SilhouetteCardMaker-macOS
          zip -r ../SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-macOS.zip *
          cd ..
          
          cd SilhouetteCardMaker-Linux
          tar -czf ../SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-Linux.tar.gz *
          cd ..
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-Windows.zip
            SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-macOS.zip
            SilhouetteCardMaker-${{ steps.get_version.outputs.version }}-Linux.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
